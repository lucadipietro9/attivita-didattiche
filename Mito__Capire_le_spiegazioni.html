<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Massi · Capire le spiegazioni</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#17354b;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:22px 18px 60px}header{background:#dfeefa;border-radius:22px;padding:24px 28px;margin-bottom:18px}h1{font-size:clamp(27px,4vw,40px);margin:5px 0}h2{font-size:26px;margin:0 0 14px}.muted{color:#526b7d}.tag{font-weight:800;letter-spacing:.06em;color:#276391}.panel{background:white;border:1px solid #d9e6ef;border-radius:22px;padding:26px;margin-top:16px;box-shadow:0 5px 18px #1e52650b}.stage{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.stage button{border:1px solid #a9c5d9;background:white;border-radius:14px;padding:12px 15px;font-weight:750;color:#254b64;cursor:pointer}.stage button.active{background:#17699f;color:white}.stage button:disabled{opacity:.65;cursor:not-allowed}.progress{height:11px;background:#e7eef4;border-radius:30px;overflow:hidden}.progress>div{height:100%;background:#2682b8;transition:width .2s}.counter{font-weight:750;color:#396a8b;margin:12px 0}.example{background:#eff7ef;border-left:6px solid #78aa84;border-radius:12px;padding:15px 18px;font-size:20px;line-height:1.5;margin:16px 0}.scene{text-align:center;font-size:65px;margin:12px 0}.question{font-size:clamp(22px,3vw,28px);font-weight:760;line-height:1.35;margin:22px 0}.answers{display:grid;gap:13px}.answer{background:#fff;border:2px solid #bdd5e6;color:#17354b;border-radius:15px;text-align:left;padding:17px 20px;font-size:20px;line-height:1.4;cursor:pointer}.answer:hover:not(:disabled){border-color:#287caf;background:#f3faff}.answer.selected{border-color:#17699f;background:#e4f2fb}.answer:disabled{cursor:default}.feedback{border-radius:14px;padding:16px 18px;font-size:19px;line-height:1.5;margin-top:18px;background:#fff2df;border:1px solid #eacfa3}.feedback.good{background:#e9f6eb;border-color:#abd3b3}.controls{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:22px}button.action{background:#17699f;border:0;color:white;border-radius:13px;padding:15px 22px;font-size:18px;font-weight:750;cursor:pointer}button.action.secondary{background:#e7eff5;color:#21526e}button.action:disabled{opacity:.4;cursor:not-allowed}.summary{font-size:21px;line-height:1.55}.score{font-size:48px;font-weight:850;color:#17699f}.hidden{display:none}footer{font-size:13px;color:#587081;margin-top:24px}@media(max-width:520px){.panel{padding:19px}.answer{font-size:18px}.scene{font-size:52px}}
</style></head><body><main class="app"><header><div class="tag">ITALIANO · COMPRENSIONE</div><h1>Capire le spiegazioni</h1><div class="muted">Leggo, penso, scelgo. Un esercizio alla volta.</div></header><div class="stage" id="tabs"></div><section class="panel" id="content" aria-live="polite"></section><footer>Attività per Massi · Nessun account necessario · Funziona anche senza Internet.</footer></main><script>
const stages=[
{title:'1. Che cosa è successo?',intro:'Prima riconosciamo il fatto. Leggi la frase e scegli che cosa è successo.',example:'Esempio: «Il vento ha fatto cadere il vaso.» → Che cosa è successo? Il vaso è caduto.',items:[
['Il bicchiere è caduto dal tavolo e si è rotto.','🥛','Che cosa è successo?',['Il bicchiere si è rotto.','Il tavolo si è rotto.'],0,'Il fatto raccontato è che il bicchiere è caduto e si è rotto.'],
['Durante la notte è nevicato e la strada si è coperta di bianco.','❄️','Che cosa è successo?',['La strada si è asciugata.','La strada si è coperta di neve.'],1,'La neve ha coperto la strada.'],
['Marco ha perso l’autobus ed è arrivato tardi a scuola.','🚌','Che cosa è successo?',['Marco è arrivato tardi.','Marco è arrivato in anticipo.'],0,'Il risultato è che Marco è arrivato tardi.'],
['Sara ha dimenticato l’ombrello e si è bagnata sotto la pioggia.','☔','Che cosa è successo?',['Sara si è bagnata.','Sara ha comprato un ombrello.'],0,'Sara si è bagnata.'],
['La lampadina si è spenta e la stanza è diventata buia.','💡','Che cosa è successo?',['La stanza è diventata più luminosa.','La stanza è diventata buia.'],1,'Senza luce, la stanza è diventata buia.'],
['Il gelato è rimasto al sole e si è sciolto.','🍦','Che cosa è successo?',['Il gelato si è sciolto.','Il gelato si è congelato.'],0,'Il gelato si è sciolto.'],
['Il pallone ha colpito una finestra e il vetro si è rotto.','⚽','Che cosa è successo?',['Il pallone è sparito.','Il vetro si è rotto.'],1,'Il vetro si è rotto.'],
['Dopo una lunga corsa, Luca si è fermato per riposare.','🏃','Che cosa è successo?',['Luca si è fermato.','Luca ha iniziato a correre.'],0,'Luca si è fermato per riposare.']
]},
{title:'2. Perché è successo?',intro:'Ora cerchiamo la causa. Una risposta spiega il fatto; l’altra dice qualcosa che non lo spiega.',example:'Esempio: «La strada è bagnata.» → Perché? «Perché ha piovuto» spiega il fatto. «Perché c’è un cartello» non lo spiega.',items:[
['La strada è bagnata.','🌧️','Perché la strada è bagnata?',['Perché ha piovuto.','Perché la strada è lunga.'],0,'La pioggia può bagnare la strada. La lunghezza non spiega perché è bagnata.'],
['Il gelato si è sciolto.','🍦','Perché si è sciolto?',['Perché il cono è di carta.','Perché è rimasto al caldo.'],1,'Il caldo fa sciogliere il gelato.'],
['Marco è arrivato tardi a scuola.','🚌','Quale frase spiega il ritardo?',['Ha perso l’autobus.','Ha uno zaino verde.'],0,'Perdere l’autobus può provocare un ritardo.'],
['La pianta si è seccata.','🪴','Quale frase può spiegare il fatto?',['Il vaso è rotondo.','Non è stata annaffiata per molto tempo.'],1,'La mancanza d’acqua può far seccare una pianta.'],
['La stanza è diventata buia.','🌙','Perché è diventata buia?',['Qualcuno ha spento la luce.','Sul tavolo c’è un libro.'],0,'Spegnere la luce può rendere buia la stanza.'],
['Il pavimento è bagnato.','🧽','Quale frase spiega il fatto?',['La porta è marrone.','Qualcuno lo ha appena lavato.'],1,'Lavare il pavimento lo rende bagnato.'],
['La bicicletta ha una gomma sgonfia.','🚲','Quale frase può spiegare il fatto?',['La gomma è stata bucata da un chiodo.','La bicicletta è rossa.'],0,'Un foro può far uscire l’aria dalla gomma.'],
['La torta è bruciata nel forno.','🎂','Quale frase può spiegare il fatto?',['La torta è rotonda.','È rimasta nel forno troppo a lungo.'],1,'Una cottura troppo lunga può bruciare la torta.'],
['Giulia ha le scarpe sporche di fango.','👟','Quale frase può spiegare il fatto?',['Ha camminato in una pozzanghera fangosa.','Ha una maglietta blu.'],0,'Camminare nel fango può sporcare le scarpe.'],
['Il cane abbaia vicino alla porta.','🐕','Quale frase può spiegare il fatto?',['Il tappeto è morbido.','Ha sentito suonare il campanello.'],1,'Il campanello può attirare l’attenzione del cane e farlo abbaiare.'],
['Il quaderno si è bagnato nello zaino.','📓','Quale frase può spiegare il fatto?',['La bottiglia d’acqua si è aperta.','Il quaderno ha molte pagine.'],0,'L’acqua uscita dalla bottiglia può bagnare il quaderno.'],
['La partita è stata interrotta.','⚽','Quale frase può spiegare il fatto?',['Le maglie sono di due colori.','È iniziato un temporale molto forte.'],1,'Un temporale forte può rendere necessario interrompere la partita.']
]},
{title:'3. Realtà o invenzione?',intro:'Due frasi possono provare a spiegare lo stesso fatto. Una racconta una causa possibile nella realtà, l’altra una causa fantastica.',example:'Esempio: «La stanza è buia.» → «È saltata la corrente» è una spiegazione possibile nella realtà. «Un drago ha mangiato la luce» è una spiegazione inventata. Anche quella inventata racconta una causa.',items:[
['La stanza è diventata buia.','🌑','Quale spiegazione potrebbe succedere davvero?',['Un drago ha ingoiato tutta la luce.','È saltata la corrente elettrica.'],1,'La corrente può interrompersi davvero. Il drago è un elemento fantastico.'],
['La strada è bagnata.','🌧️','Quale spiegazione è inventata?',['Una nuvola magica ha versato un secchio gigante d’acqua.','Durante la notte è piovuto.'],0,'La nuvola magica è una spiegazione fantastica.'],
['La montagna trema.','⛰️','Quale spiegazione potrebbe succedere davvero?',['Un gigante nascosto sotto terra si è girato nel sonno.','C’è stato un terremoto.'],1,'Un terremoto è un fenomeno reale.'],
['Il Sole è comparso nel cielo del mattino.','☀️','Quale spiegazione è inventata?',['Un dio ha guidato un carro luminoso nel cielo.','La rotazione della Terra fa apparire il Sole all’orizzonte.'],0,'Il carro del dio appartiene a una storia fantastica.'],
['Il mare è molto agitato.','🌊','Quale spiegazione potrebbe succedere davvero?',['Il vento forte ha sollevato grandi onde.','Un mostro marino ha mescolato l’acqua con un cucchiaio.'],0,'Il vento può produrre onde.'],
['La pianta è cresciuta.','🌱','Quale spiegazione è inventata?',['Ha ricevuto acqua, luce e sostanze nutritive.','Una fata le ha ordinato di diventare alta in un minuto.'],1,'La fata è una spiegazione fantastica.'],
['Si sentono dei tuoni.','⛈️','Quale spiegazione potrebbe succedere davvero?',['Un gigante sta facendo rotolare pietre sopra le nuvole.','L’aria si espande rapidamente dopo un fulmine.'],1,'Il tuono è legato al rapido riscaldamento dell’aria provocato dal fulmine.'],
['Nel giardino sono spuntati dei fiori.','🌷','Quale spiegazione è inventata?',['Il clima mite ha favorito la crescita delle piante.','Un mago ha pronunciato una formula e i fiori sono apparsi.'],1,'Il mago appartiene a una storia fantastica.'],
['Il fiume è uscito dagli argini.','🏞️','Quale spiegazione potrebbe succedere davvero?',['Le piogge intense hanno fatto salire il livello dell’acqua.','Un pesce parlante ha ordinato al fiume di allargarsi.'],0,'Le piogge possono far aumentare la portata del fiume.'],
['La notte è arrivata.','🌌','Quale spiegazione è inventata?',['La Terra ruota e il luogo in cui siamo non è più rivolto verso il Sole.','Un uccello gigante ha steso un mantello nero sopra il cielo.'],1,'L’uccello gigante è una spiegazione fantastica.']
]}];
let stage=0,index=0,selected=null,checked=false,correctCount=0,attempts=0,finished=false;let results=stages.map(()=>({correct:0,total:0}));
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const s=stages[stage];$('tabs').innerHTML=stages.map((x,i)=>`<button ${i>stage&&!results[i-1]?.total?'disabled':''} class="${stage===i?'active':''}" onclick="go(${i})">${esc(x.title)}</button>`).join('');if(finished){$('content').innerHTML=`<h2>Attività completata!</h2><div class="score">${results.reduce((a,b)=>a+b.correct,0)} / ${results.reduce((a,b)=>a+b.total,0)}</div><p class="summary">Risposte corrette al primo tentativo. Puoi ripassare gli esercizi oppure ricominciare.</p><div class="controls"><button class="action" onclick="restart()">Ricomincia</button></div>`;return}const item=s.items[index];$('content').innerHTML=`<h2>${esc(s.title)}</h2><p class="muted">${esc(s.intro)}</p><div class="example">${esc(s.example)}</div><div class="counter">Esercizio ${index+1} di ${s.items.length}</div><div class="progress"><div style="width:${index/s.items.length*100}%"></div></div><div class="scene" aria-hidden="true">${item[1]}</div><p class="question">${esc(item[0])}<br><span style="color:#23658d">${esc(item[2])}</span></p><div class="answers">${item[3].map((a,i)=>`<button class="answer ${selected===i?'selected':''}" onclick="choose(${i})" ${checked?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>${checked?`<div class="feedback ${selected===item[4]?'good':''}">${selected===item[4]?'✓ Esatto!':'Riproviamo: '+esc(item[5])}</div>`:''}<div class="controls"><button class="action secondary" onclick="previous()" ${index===0?'disabled':''}>Indietro</button>${checked?`<button class="action" onclick="next()">${index===s.items.length-1?(stage===stages.length-1?'Termina':'Passa alla fase successiva'):'Avanti →'}</button>`:`<button class="action" onclick="verify()" ${selected===null?'disabled':''}>Controlla</button>`}</div>`}
function choose(i){if(!checked){selected=i;render()}}function verify(){if(selected===null)return;const item=stages[stage].items[index];attempts++;if(selected===item[4]){if(attempts===1)results[stage].correct++;results[stage].total++;checked=true;render()}else{checked=true;render()}}
function next(){const good=selected===stages[stage].items[index][4];if(!good){checked=false;selected=null;render();return}if(index<stages[stage].items.length-1){index++}else if(stage<stages.length-1){stage++;index=0}else{finished=true}selected=null;checked=false;attempts=0;render()}
function previous(){if(index>0){index--;selected=null;checked=false;attempts=0;render()}}function go(i){if(i>stage&&!results[i-1]?.total)return;stage=i;index=0;selected=null;checked=false;attempts=0;finished=false;render()}function restart(){stage=0;index=0;selected=null;checked=false;correctCount=0;attempts=0;finished=false;results=stages.map(()=>({correct:0,total:0}));render()}render();
</script></body></html>
