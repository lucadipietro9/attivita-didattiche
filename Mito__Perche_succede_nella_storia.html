<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Massi — Perché succede nella storia?</title>
<style>
:root{font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS",Arial,sans-serif;color:#1b2936;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:24px 14px}main{max-width:820px;margin:0 auto}.panel{background:white;border:2px solid #d9e2ed;border-radius:20px;padding:30px 34px;box-shadow:0 5px 18px #2332470b}h1{font-size:clamp(28px,4.5vw,38px);margin:0 0 9px}h2{font-size:clamp(23px,3.7vw,29px);margin:0 0 22px}.small{font-family:Arial,sans-serif;color:#596779;font-size:16px}.bar{width:100%;background:#e4eaf1;height:12px;border-radius:20px;overflow:hidden;margin:19px 0 27px}.fill{height:100%;background:#4682ad;transition:width .2s}.story{font-size:clamp(22px,3.5vw,27px);line-height:1.75;background:#f5f8fc;border-left:6px solid #75a5c6;padding:17px 21px;border-radius:12px;margin-bottom:28px;font-weight:500}.question{font-size:clamp(23px,3.5vw,29px);font-weight:800;margin:22px 0}.choices{display:grid;gap:13px}button{font:inherit;cursor:pointer;border-radius:13px}button.option{background:white;border:2px solid #b8c7d6;padding:18px 20px;font-size:clamp(20px,3vw,24px);line-height:1.45;text-align:left;color:#182e42;min-height:72px}button.option:hover:not(:disabled),button.option:focus-visible{border-color:#2474aa;background:#f1f8ff}button.option.correct{border:3px solid #248454;background:#edf9f1}button.option.wrong{border:3px solid #b76549;background:#fff2ed}button.option:disabled{cursor:default}button.primary{margin-top:23px;padding:15px 24px;border:0;background:#236f9e;color:white;font-size:22px;font-weight:bold}button.secondary{padding:11px 15px;border:2px solid #a6b7c6;background:white;color:#1b2936;font-size:18px}.feedback{margin-top:20px;font-size:21px;line-height:1.4;min-height:33px;font-weight:bold}.ok{color:#1b7650}.retry{color:#985039}.hide{display:none}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.tag{background:#eaf2f8;border-radius:100px;padding:7px 13px;font-size:16px;color:#345c75}.intro{font-size:23px;line-height:1.55}.end{font-size:22px;line-height:1.6}.results{border-collapse:collapse;width:100%;font:16px Arial,sans-serif;margin:18px 0}.results th,.results td{border-bottom:1px solid #d5dfeb;padding:12px 8px;text-align:left}.note{font:17px/1.55 Arial,sans-serif;color:#46576a;margin-top:22px}button:focus-visible{outline:4px solid #ffc857;outline-offset:2px}@media(max-width:560px){.panel{padding:21px 17px}.story{padding:13px 15px}}
</style>
</head>
<body><main><section class="panel" id="app"></section></main>
<script>
const stories=[
{lines:['Nel giardino vive una pianta magica.','La pianta canta una canzone.','Tutti gli uccelli si fermano ad ascoltarla.'],questions:[{q:'Che cosa fanno gli uccelli?',a:['Volano via.','Si fermano ad ascoltare.','Mangiano i semi.'],correct:1,why:'Gli uccelli si fermano ad ascoltare la canzone.'},{q:'Nella storia, perché gli uccelli si fermano?',a:['Perché la pianta canta.','Perché arriva un temporale.','Perché hanno sonno.'],correct:0,why:'Si fermano perché la pianta magica canta.'}]},
{lines:['Un drago attraversa il paese.','Il drago soffia una nuvola di neve.','La piazza diventa tutta bianca.'],questions:[{q:'Che cosa succede alla piazza?',a:['Diventa bianca.','Si riempie di fiori.','Diventa buia.'],correct:0,why:'La piazza diventa tutta bianca.'},{q:'Nella storia, perché la piazza diventa bianca?',a:['Perché passano le automobili.','Perché il drago soffia neve.','Perché qualcuno la dipinge.'],correct:1,why:'È il drago a soffiare la nuvola di neve.'}]},
{lines:['Una statua magica si sveglia nel museo.','La statua batte le mani tre volte.','Tutti i quadri iniziano a ballare.'],questions:[{q:'Che cosa fanno i quadri?',a:['Cadono a terra.','Iniziano a ballare.','Scompaiono.'],correct:1,why:'I quadri iniziano a ballare.'},{q:'Nella storia, perché i quadri ballano?',a:['Perché il museo chiude.','Perché entra un visitatore.','Perché la statua batte le mani.'],correct:2,why:'I quadri ballano dopo che la statua magica batte le mani.'}]},
{lines:['Sul monte abita un gigante.','Il gigante scuote il suo enorme mantello.','Nel villaggio comincia a soffiare un vento fortissimo.'],questions:[{q:'Che cosa succede nel villaggio?',a:['Soffia un vento fortissimo.','Nevica.','Si accendono le luci.'],correct:0,why:'Nel villaggio soffia un vento fortissimo.'},{q:'Nella storia, perché soffia il vento?',a:['Perché arriva un treno.','Perché il gigante scuote il mantello.','Perché si apre una finestra.'],correct:1,why:'Il vento arriva quando il gigante scuote il mantello.'}]},
{lines:['Una maga abita vicino al fiume.','La maga tocca l’acqua con una bacchetta.','Il fiume diventa di colore viola.'],questions:[{q:'Che cosa succede al fiume?',a:['Si prosciuga.','Diventa viola.','Diventa più largo.'],correct:1,why:'Il fiume diventa viola.'},{q:'Nella storia, perché il fiume diventa viola?',a:['Perché piove molto.','Perché il sole tramonta.','Perché la maga tocca l’acqua con la bacchetta.'],correct:2,why:'La bacchetta della maga cambia il colore dell’acqua.'}]},
{lines:['Nel bosco vive una volpe parlante.','La volpe pronuncia una parola segreta.','Una porta nascosta compare nel tronco di un albero.'],questions:[{q:'Che cosa compare nell’albero?',a:['Una porta nascosta.','Un nido.','Una scala di ferro.'],correct:0,why:'Nel tronco compare una porta nascosta.'},{q:'Nella storia, perché compare la porta?',a:['Perché la volpe dice una parola segreta.','Perché un uomo taglia l’albero.','Perché arriva il vento.'],correct:0,why:'La parola segreta della volpe fa comparire la porta.'}]}
];
let story=0, question=0, tries=0, first=[], done=false;
const app=document.getElementById('app');
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function header(){const step=story*2+question+1,total=stories.length*2;return `<div class="topline"><span class="small">STORIA ${story+1} DI ${stories.length}</span><span class="tag">Domanda ${question+1} di 2</span></div><div class="bar"><div class="fill" style="width:${(step-1)/total*100}%"></div></div>`}
function start(){app.innerHTML=`<h1>Perché succede nella storia?</h1><p class="intro">Leggi una breve storia. Poi rispondi alle domande usando <strong>quello che racconta la storia</strong>, anche quando è inventato.</p><p class="intro">Ci sono <strong>6 storie</strong>. Per ogni storia trovi <strong>2 domande</strong>, una alla volta.</p><button class="primary" id="go">INIZIA</button>`;document.getElementById('go').onclick=render}
function render(){done=false;tries=0;const s=stories[story],item=s.questions[question];app.innerHTML=`${header()}<h2>Leggi la storia</h2><div class="story">${s.lines.map(esc).join('<br>')}</div><div class="question">${esc(item.q)}</div><div class="choices" id="choices">${item.a.map((a,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div class="feedback" aria-live="polite" id="feedback"></div><button class="primary hide" id="next">${story===stories.length-1&&question===1?'VEDI IL RIEPILOGO':question===0?'SECONDA DOMANDA':'STORIA SUCCESSIVA'}</button>`;document.querySelectorAll('.option').forEach(el=>el.onclick=()=>answer(Number(el.dataset.i)));document.getElementById('next').onclick=next}
function answer(i){if(done)return;const item=stories[story].questions[question], buttons=[...document.querySelectorAll('.option')],fb=document.getElementById('feedback');tries++;if(tries===1)first.push({story:story+1,kind:question===0?'Che cosa succede':'Perché succede',ok:i===item.correct});if(i===item.correct){done=true;buttons.forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('correct')});fb.className='feedback ok';fb.textContent='Esatto! '+item.why;document.getElementById('next').classList.remove('hide')}else{buttons[i].classList.add('wrong');buttons[i].disabled=true;fb.className='feedback retry';fb.textContent='Rileggi la storia e riprova. La risposta è nel testo.'}}
function next(){if(question===0){question=1;render()}else if(story<stories.length-1){story++;question=0;render()}else summary()}
function summary(){let count=k=>first.filter(r=>r.kind===k&&r.ok).length;app.innerHTML=`<h1>Attività completata!</h1><p class="end">Hai letto tutte le storie e risposto alle domande.</p><h2>Riepilogo per l'insegnante</h2><table class="results"><tr><th>Tipo di domanda</th><th>Corrette al primo tentativo</th></tr><tr><td>Che cosa succede?</td><td>${count('Che cosa succede')} su ${stories.length}</td></tr><tr><td>Perché succede nella storia?</td><td>${count('Perché succede')} su ${stories.length}</td></tr></table><details><summary>Mostra il dettaglio delle risposte</summary><table class="results"><tr><th>Storia</th><th>Domanda</th><th>Primo tentativo</th></tr>${first.map(r=>`<tr><td>${r.story}</td><td>${r.kind}</td><td>${r.ok?'Corretta':'Da riprovare'}</td></tr>`).join('')}</table></details><p class="note">Osserva anche se Massi rilegge la storia, se risponde autonomamente e se cerca una spiegazione diversa da quella raccontata. Le risposte registrate si riferiscono al primo tentativo.</p><button class="secondary" id="again">Ricomincia</button>`;document.getElementById('again').onclick=()=>{story=0;question=0;first=[];start()}}
start();
</script>
</body></html>
