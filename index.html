<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attività didattiche</title><style>body{margin:0;background:#f5f6f8;color:#182338;font:17px system-ui,-apple-system,sans-serif}main{max-width:980px;margin:auto;padding:35px 20px}h1{font-size:clamp(30px,5vw,45px);margin-bottom:6px}p{color:#596579}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:28px}.card{background:white;border:1px solid #e0e5ee;border-radius:16px;padding:20px;box-shadow:0 3px 12px #19263a0a}.card h2{font-size:21px;margin:0 0 15px}.card a{display:block;padding:12px;background:#edf4ff;color:#164b8c;text-decoration:none;border-radius:9px;font-weight:650;margin:8px 0}.card a:hover{background:#dceaff}.empty{color:#7c8796;font-size:14px}#status{font-size:14px}</style></head><body><main><h1>Attività didattiche</h1><p>Giochi interattivi organizzati per materia.</p><div id="status">Caricamento attività…</div><div id="grid" class="grid"></div></main><script>
const owner='lucadipietro9',repo='attivita-didattiche';
const subjects=['Geografia','Storia','Matematica','Italiano','Scienze','Inglese'];
const grid=document.getElementById('grid'),status=document.getElementById('status');
function show(files){grid.replaceChildren();for(const subject of subjects){const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=subject;card.append(title);const matches=files.filter(f=>f.path.toLowerCase().startsWith(subject.toLowerCase()+'__')||f.path.toLowerCase().startsWith(subject.toLowerCase()+'/'));if(matches.length){for(const f of matches){const a=document.createElement('a');a.href=f.path.split('/').map(encodeURIComponent).join('/');let name=f.path.split('/').pop().replace(/\.html$/i,'').replace(new RegExp('^'+subject+'__','i'),'').replace(/[_-]/g,' ');a.textContent=name;a.setAttribute('aria-label','Apri '+name);card.append(a)}}else{const e=document.createElement('div');e.className='empty';e.textContent='Nessuna attività ancora';card.append(e)}grid.append(card)}}
// Immediate local fallback while the live catalog is loaded.
show([{path:'Geografia__Regioni_italiane.html'}]);
fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalogo non disponibile');return r.json()}).then(d=>{const files=(d.tree||[]).filter(f=>f.type==='blob'&&/\.html$/i.test(f.path)&&f.path!=='index.html');show(files);status.textContent='Scegli una materia e apri un gioco.'}).catch(()=>{status.textContent='Catalogo non aggiornato: per vedere tutte le attività serve la connessione Internet.'});
</script></body></html>
