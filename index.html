<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Attività didattiche</title>
<style>
:root{--ink:#07384a;--muted:#516673;--blue:#609ccc;--green:#60ae6b;--orange:#f39838;--purple:#8a68a9;--line:#e7edef}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:"Avenir Next",Avenir,"Nunito",system-ui,sans-serif}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #153f7b;outline-offset:4px}main{max-width:1050px;margin:0 auto;padding:48px 28px 90px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.eyebrow{font-weight:800;letter-spacing:.12em;font-size:13px;color:#67818c}.title{font-size:clamp(31px,5vw,49px);font-weight:850;line-height:1.1;margin:12px 0 12px}.intro{font-size:18px;color:var(--muted);margin:0}.tag{padding:13px 18px;background:#f0f3f4;border-radius:13px;font-size:14px;font-weight:800;white-space:nowrap}.rule{height:1px;background:var(--line);margin:33px 0}.section-title{font-size:25px;font-weight:850;margin:0 0 24px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.tile{appearance:none;text-align:left;min-height:222px;padding:23px 22px 22px;border:2.5px solid var(--tone);border-radius:30px;background:var(--tint);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;transition:transform .15s,box-shadow .15s}.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px #183c4d12}.tile:active{transform:translateY(0)}.tile .num{font-size:19px;font-weight:800;color:var(--tone)}.icon{margin:10px 0 7px;width:49px;height:49px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tile .label{font-size:23px;font-weight:850;margin-top:auto;letter-spacing:.01em}.tile .count{font-size:14px;color:var(--muted);margin-top:4px}.blue{--tone:var(--blue);--tint:#e9f4fa}.green{--tone:var(--green);--tint:#ebf6ec}.orange{--tone:var(--orange);--tint:#fff2df}.purple{--tone:var(--purple);--tint:#f2edf7}.activities{display:none}.activities.active{display:block}.home.hidden{display:none}.back{background:#f1f5f6;color:var(--ink);border:0;border-radius:12px;padding:13px 17px;font-weight:800;cursor:pointer;margin-bottom:24px}.activity-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.activity{display:flex;align-items:center;gap:18px;text-decoration:none;color:var(--ink);padding:23px 22px;border:2px solid var(--tone);background:var(--tint);border-radius:23px;min-height:105px}.activity:hover{filter:brightness(.98)}.activity .counter{font-weight:800;color:var(--tone);font-size:19px}.activity strong{font-size:21px;display:block}.activity small{display:block;color:var(--muted);margin-top:5px}.activity .arrow{margin-left:auto;font-size:25px}.empty{padding:25px;background:#f3f5f5;border-radius:20px;color:var(--muted)}.status{font-size:13px;color:#647782;margin-top:27px;min-height:20px}.footer{margin-top:35px;color:#6a7c84;font-size:13px}@media(max-width:760px){main{padding:29px 19px 65px}.tag{display:none}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{min-height:180px;padding:17px;border-radius:23px}.tile .label{font-size:19px}.tile .count{font-size:12px}.icon{width:39px;height:39px}.activity-list{grid-template-columns:1fr}.section-title{font-size:23px}}@media(max-width:370px){.tiles{grid-template-columns:1fr}.tile{min-height:150px}}
</style></head><body><main>
<section id="home" class="home"><div class="top"><div><div class="eyebrow">IL MIO SPAZIO DI LAVORO</div><h1 class="title">ATTIVITÀ<br>DIDATTICHE</h1><p class="intro">Scegli una materia per iniziare.</p></div><div class="tag">LE MIE ATTIVITÀ</div></div><div class="rule"></div><h2 class="section-title">SCEGLI UNA MATERIA</h2><div class="tiles" id="tiles"></div></section>
<section id="activities" class="activities"><button class="back" id="back" type="button">← TORNA ALLE MATERIE</button><div class="eyebrow">LE MIE ATTIVITÀ</div><h1 class="title" id="subject-title"></h1><p class="intro">Scegli un'attività da svolgere.</p><div class="rule"></div><div id="activity-list" class="activity-list"></div></section>
<div id="status" class="status" role="status">Caricamento attività…</div><div class="footer">Attività interattive · Nessun limite di tempo</div></main>
<script>
const owner='lucadipietro9',repo='attivita-didattiche';
const subjects=[{name:'Geografia',tone:'blue',icon:'map'},{name:'Storia',tone:'green',icon:'clock'},{name:'Matematica',tone:'orange',icon:'numbers'},{name:'Italiano',tone:'purple',icon:'book'},{name:'Scienze',tone:'blue',icon:'flask'},{name:'Inglese',tone:'green',icon:'chat'}];
const icons={map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',numbers:'<path d="M4 8h7M7.5 4.5v7M15 6h6M15 10h6M4 18h7M15 16h6M15 20h6"/>',book:'<path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1zM12 6v14"/>',flask:'<path d="M9 3h6M10 3v7l-6 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-9V3M7 16h10"/>',chat:'<path d="M4 5h16v12H9l-5 4z"/><path d="M8 10h8M8 13h5"/>'};
let files=[{path:'Geografia__Regioni_italiane.html'}];let current=null;
function matches(s){return files.filter(f=>f.path.toLowerCase().startsWith(s.toLowerCase()+'__')||f.path.toLowerCase().startsWith(s.toLowerCase()+'/')).sort((a,b)=>a.path.localeCompare(b.path,'it'))}
function label(path,s){return path.split('/').pop().replace(/\.html$/i,'').replace(new RegExp('^'+s+'__','i'),'').replace(/[_-]+/g,' ').trim()}
function renderTiles(){const el=document.getElementById('tiles');el.replaceChildren();subjects.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='tile '+s.tone;const n=matches(s.name).length;b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[s.icon]}</svg><span class="label">${s.name.toUpperCase()}</span><span class="count">${n===0?'Nessuna attività':n===1?'1 attività':n+' attività'}</span>`;b.onclick=()=>openSubject(s.name);el.append(b)})}
function openSubject(name){current=name;const s=subjects.find(x=>x.name===name);document.getElementById('home').classList.add('hidden');document.getElementById('activities').classList.add('active');document.getElementById('subject-title').textContent=name.toUpperCase();const list=document.getElementById('activity-list');list.replaceChildren();const found=matches(name);if(!found.length){const e=document.createElement('div');e.className='empty';e.textContent='Qui troverai presto nuove attività.';list.append(e)}else found.forEach((f,i)=>{const a=document.createElement('a');a.className='activity '+s.tone;a.href=f.path.split('/').map(encodeURIComponent).join('/');const n=document.createElement('span');n.className='counter';n.textContent=String(i+1).padStart(2,'0');const txt=document.createElement('span');const strong=document.createElement('strong');strong.textContent=label(f.path,name);const small=document.createElement('small');small.textContent='APRI IL GIOCO';txt.append(strong,small);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';a.append(n,txt,arrow);list.append(a)});window.scrollTo({top:0,behavior:'instant'});history.replaceState(null,'','#'+encodeURIComponent(name.toLowerCase()))}
function goHome(){current=null;document.getElementById('home').classList.remove('hidden');document.getElementById('activities').classList.remove('active');history.replaceState(null,'',location.pathname+location.search);window.scrollTo({top:0,behavior:'instant'})}
document.getElementById('back').onclick=goHome;renderTiles();const start=decodeURIComponent(location.hash.slice(1)).toLowerCase();const found=subjects.find(s=>s.name.toLowerCase()===start);if(found)openSubject(found.name);
fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Catalogo non disponibile');return r.json()}).then(d=>{files=(d.tree||[]).filter(f=>f.type==='blob'&&/\.html$/i.test(f.path)&&f.path!=='index.html');renderTiles();if(current)openSubject(current);document.getElementById('status').textContent='Le attività sono aggiornate.'}).catch(()=>{document.getElementById('status').textContent='Per aggiornare l’elenco delle attività è necessaria la connessione Internet.'});
</script></body></html>
